name: Compilar APK de Android (debug)

# Genera una APK de LiveNest para Android y la deja como artefacto
# descargable en el run de Actions — sin necesitar Android Studio ni el SDK
# instalados en ninguna máquina local. Es una APK de "debug": sirve para
# probarla en el celular (activando "Instalar apps de origen desconocido"),
# pero no está firmada para Play Store — ver ANDROID.md para ese paso.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x exige Node >=22 (el resto del proyecto sigue
          # buildeando con Node 20 tranquilo, ver deploy-pages.yml — esto es
          # solo para este workflow, que corre `npx cap sync`).
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - run: npm run build:web
        env:
          # Mismas variables públicas que usa el deploy web (Settings →
          # Secrets and variables → Actions → Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - run: npx cap sync android

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: livenest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
