name: Compilar APK de Android (debug)

# Genera una APK de LiveNest para Android y la publica en dos lugares — sin
# necesitar Android Studio ni el SDK instalados en ninguna máquina local:
#   1. Como artefacto del run de Actions (requiere estar logueado en GitHub
#      para descargarlo).
#   2. Como GitHub Release pública (sin login) — la app instalada también
#      se fija sola contra esta cada vez que se abre/vuelve del segundo
#      plano, y avisa si hay una más nueva (ver src/lib/appUpdate.ts).
# Es una APK de "debug": sirve para probarla en el celular (activando
# "Instalar apps de origen desconocido"), pero no está firmada para Play
# Store — ver ANDROID.md para ese paso.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write # crear la GitHub Release de abajo necesita esto

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x exige Node >=22 (el resto del proyecto sigue
          # buildeando con Node 20 tranquilo, ver deploy-pages.yml — esto es
          # solo para este workflow, que corre `npx cap sync`).
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - run: npm run build:web
        env:
          # Mismas variables públicas que usa el deploy web (Settings →
          # Secrets and variables → Actions → Variables) — con fallback al
          # valor real si la variable del repo no está disponible acá. Esto
          # pasó en la práctica: esas "Variables" están restringidas a la
          # rama main (Selected branches), así que en cualquier otra rama
          # (como claude/**, donde corre este workflow) llegaban vacías, la
          # app tiraba "Falta configuración de Supabase" al arrancar (ver
          # src/lib/supabase.ts) y la APK quedaba en pantalla blanca. No son
          # datos sensibles — la anon key está pensada para ser pública, la
          # protección real es RLS en la base — así que el fallback no es un
          # riesgo de seguridad, solo evita depender de esa restricción.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://wlkzpvfkczkrvuueblfq.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indsa3pwdmZrY3prcnZ1dWVibGZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjEzNTQsImV4cCI6MjA5OTg5NzM1NH0.hAiC2rXZ8JlhasA7sz8drdJ6F7qZQrNIRL0IUsyyIU4' }}
          # Número de esta corrida de Actions, horneado en el bundle — es lo
          # que src/lib/appUpdate.ts compara contra la última GitHub Release
          # para avisar sola cuando hay una versión más nueva (ver el paso
          # "Publicar GitHub Release" más abajo).
          VITE_APP_BUILD: ${{ github.run_number }}

      - run: npx cap sync android

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: livenest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag con el número de corrida — cada build es su propia release,
          # y GitHub marca la más reciente como "latest" solo. La app la
          # detecta vía la API pública /releases/latest (sin login) — ver
          # src/lib/appUpdate.ts. El nombre de la release aclara que es de
          # prueba/debug, no una versión "oficial" para el público general.
          tag_name: android-build-${{ github.run_number }}
          name: "LiveNest Android (debug) — build ${{ github.run_number }}"
          body: |
            APK de prueba generada automáticamente desde el commit ${{ github.sha }}.
            No está firmada para Play Store — solo para instalar a mano (sideload).
          files: android/app/build/outputs/apk/debug/app-debug.apk
